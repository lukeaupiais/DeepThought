name: Standalone acceptance

on:
  # Branches get CI through their pull request; pushing them as well would run it twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request supersedes its running checks; main keeps every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pythons: ${{ steps.scope.outputs.pythons }}
      tests: ${{ steps.scope.outputs.tests }}
      ground_truth: ${{ steps.scope.outputs.ground_truth }}
      gate: ${{ steps.scope.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reject AI author identities and trailers in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A new branch (or a manual run) has no "before": check what the
          # default branch does not already contain.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          python tools/check_attribution.py "$BASE..$HEAD"
      - name: Choose the checks this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # main, tags and manual runs always get every check on every Python.
          # A pull request into main gets the oldest and newest Python and the
          # checks its files can affect. A pull request stacked on another
          # branch gets the test suite only; its full run comes when it is
          # rebased onto main, and its gate has a different name until then,
          # so it cannot pass as the "ci-ok" a merge into main requires.
          all='["3.10", "3.11", "3.12", "3.13", "3.14"]'
          if [ "$EVENT" != pull_request ]; then
            mode=full
          elif [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            mode=main-pr
          else
            mode=stacked
          fi
          changed=$(mktemp)
          if [ "$mode" != full ]; then
            git diff --name-only "$BASE...$HEAD" > "$changed"
          fi
          echo "Mode: $mode; changed files:"; cat "$changed"
          # Files that cannot change the package, its tests or its scores.
          docs_only=$(grep -vqE '^docs/|\.md$|^LICENSE$|^NOTICE$|^licenses/' "$changed" && echo false || echo true)
          # What the ground-truth scores read: the engine, the scoring tools,
          # the pinned corpora and their baselines, the build and this workflow.
          scored=$(grep -qE '^src/|^tools/|^evals/ground_truth/|^pyproject\.toml$|^\.github/workflows/' "$changed" && echo true || echo false)
          case "$mode" in
            full)    pythons=$all; tests=true; ground_truth=true; gate=ci-ok ;;
            main-pr)
              if [ "$docs_only" = true ]; then
                pythons='["3.12"]'; tests=false; ground_truth=false
              else
                pythons='["3.10", "3.14"]'; tests=true; ground_truth=$scored
              fi
              gate=ci-ok ;;
            stacked)
              pythons='[]'; tests=$([ "$docs_only" = true ] && echo false || echo true)
              ground_truth=false; gate='ci-ok (stacked: tests only, full run after rebase onto main)' ;;
          esac
          {
            echo "pythons=$pythons"
            echo "tests=$tests"
            echo "ground_truth=$ground_truth"
            echo "gate=$gate"
          } >> "$GITHUB_OUTPUT"
          echo "Pythons: $pythons; tests: $tests; ground truth: $ground_truth; gate: $gate"

  acceptance:
    needs: attribution
    if: needs.attribution.outputs.pythons != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.attribution.outputs.pythons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: false
      - name: Provision build and acceptance tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          python -m pip install 'build==1.4.3' 'hatchling==1.30.1' 'ruff==0.15.18'
      - name: Check source and build reproducibility
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
          python -m build --no-isolation
          python -m build --no-isolation --wheel --outdir direct-dist
          cmp dist/*.whl direct-dist/*.whl
      - name: Provision installed artifacts outside the checkout
        run: |
          wheel=$(realpath dist/*.whl)
          python -m venv "$RUNNER_TEMP/deepthought-full"
          python -m venv "$RUNNER_TEMP/deepthought-core"
          "$RUNNER_TEMP/deepthought-full/bin/python" -m pip install "$wheel[languages,scip]"
          "$RUNNER_TEMP/deepthought-core/bin/python" -m pip install --no-index --no-deps "$wheel"
      - name: Install the pinned SCIP indexers and pyright
        run: |
          npm install -g @sourcegraph/scip-python@0.6.8 @sourcegraph/scip-typescript@0.6.2 pyright@1.1.409 @vue/compiler-sfc@3.5.45 @cs-au-dk/jelly@0.13.0
          GOBIN="$RUNNER_TEMP/bin" go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "DEEPTHOUGHT_PYRIGHT=$(npm prefix -g)/bin/pyright" >> "$GITHUB_ENV"
      - name: Install the pinned Go callgraph into the full installation
        run: |
          # Offline acceptance clears the environment and keeps only the venv on PATH.
          GOBIN="$RUNNER_TEMP/deepthought-full/bin" go install golang.org/x/tools/cmd/callgraph@v0.31.0
          (cd src/deepthought/genfiles && GOBIN="$RUNNER_TEMP/deepthought-full/bin" go install .)
          ln -s "$(go env GOROOT)/bin/go" "$RUNNER_TEMP/deepthought-full/bin/go"
      - name: Accept full installation offline
        run: python tools/verify_offline.py --privileged --python "$RUNNER_TEMP/deepthought-full/bin/python"
      - name: Accept core-only installation offline
        run: python tools/verify_offline.py --privileged --core-only --python "$RUNNER_TEMP/deepthought-core/bin/python"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepthought-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  graph-port:
    needs: attribution
    if: needs.attribution.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
        env:
          NEO4J_AUTH: neo4j/deepthought-test-only
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
    env:
      DEEPTHOUGHT_NEO4J_URI: bolt://localhost:7687
      DEEPTHOUGHT_NEO4J_USER: neo4j
      DEEPTHOUGHT_NEO4J_PASSWORD: deepthought-test-only
      DEEPTHOUGHT_NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the core graph port
        run: |
          python -m pip install 'build==1.4.3' 'hatchling==1.30.1' 'ruff==0.15.18'
          ruff check src tests tools
          ruff format --check src tests tools
          python -m build --no-isolation --wheel
          python -m pip install "$(realpath dist/*.whl)[languages,scip,neo4j,mcp]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install the pinned SCIP indexers, pyright and callgraph
        run: |
          npm install -g @sourcegraph/scip-python@0.6.8 @sourcegraph/scip-typescript@0.6.2 pyright@1.1.409 @vue/compiler-sfc@3.5.45 @cs-au-dk/jelly@0.13.0
          GOBIN="$RUNNER_TEMP/bin" go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/tools/cmd/callgraph@v0.31.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "DEEPTHOUGHT_PYRIGHT=$(npm prefix -g)/bin/pyright" >> "$GITHUB_ENV"
      - name: Check the indexers are found
        run: python -m deepthought indexers
      - name: Wait for the dedicated test database
        run: |
          python - <<'PY'
          import os, time
          from neo4j import GraphDatabase
          with GraphDatabase.driver(os.environ['DEEPTHOUGHT_NEO4J_URI'], auth=('neo4j', os.environ['DEEPTHOUGHT_NEO4J_PASSWORD'])) as driver:
              for attempt in range(60):
                  try:
                      driver.verify_connectivity()
                      break
                  except Exception:
                      if attempt == 59:
                          raise
                      time.sleep(1)
          PY
      - name: Verify real imports, queries, CLI and MCP
        run: python -m unittest discover -s tests -v

  ground-truth:
    needs: attribution
    if: needs.attribution.outputs.ground_truth == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the engine
        run: |
          python -m pip install 'build==1.4.3' 'hatchling==1.30.1'
          python -m build --no-isolation --wheel
          python -m pip install "$(realpath dist/*.whl)[languages,scip]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install the pinned SCIP indexers and pyright
        run: |
          npm install -g @sourcegraph/scip-python@0.6.8 @sourcegraph/scip-typescript@0.6.2 pyright@1.1.409 @vue/compiler-sfc@3.5.45 @cs-au-dk/jelly@0.13.0 pnpm@10.12.1
          # scip-typescript --pnpm-workspaces runs pnpm; keep it from switching to a
          # corpus's packageManager version, which it would try to download.
          echo "npm_config_manage_package_manager_versions=false" >> "$GITHUB_ENV"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/tools/cmd/callgraph@v0.31.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "DEEPTHOUGHT_PYRIGHT=$(npm prefix -g)/bin/pyright" >> "$GITHUB_ENV"
      - name: Check the indexers are found
        run: python -m deepthought indexers
      - name: Score the pinned ground-truth corpus against its baseline
        run: python tools/ground_truth.py check --cache "$RUNNER_TEMP/ground-truth" --examples 5

  # The SCIP-backed corpora run beside the pinned ones, so neither waits
  # for the other.
  ground-truth-scip:
    needs: attribution
    if: needs.attribution.outputs.ground_truth == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the engine
        run: |
          python -m pip install 'build==1.4.3' 'hatchling==1.30.1'
          python -m build --no-isolation --wheel
          python -m pip install "$(realpath dist/*.whl)[languages,scip]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install the pinned SCIP indexers and pyright
        run: |
          npm install -g @sourcegraph/scip-python@0.6.8 @sourcegraph/scip-typescript@0.6.2 pyright@1.1.409 @vue/compiler-sfc@3.5.45 @cs-au-dk/jelly@0.13.0 pnpm@10.12.1
          # scip-typescript --pnpm-workspaces runs pnpm; keep it from switching to a
          # corpus's packageManager version, which it would try to download.
          echo "npm_config_manage_package_manager_versions=false" >> "$GITHUB_ENV"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/scip-code/scip-go/cmd/scip-go@v0.2.7
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/tools/cmd/callgraph@v0.31.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "DEEPTHOUGHT_PYRIGHT=$(npm prefix -g)/bin/pyright" >> "$GITHUB_ENV"
      - name: Check the indexers are found
        run: python -m deepthought indexers
      - name: Score the SCIP-backed ground-truth corpora
        run: python tools/ground_truth.py check --scip --cache "$RUNNER_TEMP/ground-truth" --examples 5 --corpus chi --corpus cobra --corpus click --corpus httpx --corpus hono --corpus preact

  # The one check a merge into main waits for (branch protection and
  # auto-merge name it). Skipped jobs count as passed; failed or cancelled
  # ones do not.
  ci-ok:
    name: ${{ needs.attribution.outputs.gate || 'ci-ok' }}
    if: ${{ !cancelled() }}
    needs: [attribution, acceptance, graph-port, ground-truth, ground-truth-scip]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required check ended in $result"; exit 1 ;;
            esac
          done
