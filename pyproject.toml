[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "deepthought-analysis-engine"
version = "0.2.5a1"
description = "Local, model-free source analysis and portable reference graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*"]
dependencies = []

[project.optional-dependencies]
neo4j = ["neo4j==5.28.8"]
mcp = ["mcp>=1.6,<2", "neo4j==5.28.8"]
python = ["tree-sitter==0.25.2", "tree-sitter-python==0.25.0"]
typescript = ["tree-sitter==0.25.2", "tree-sitter-typescript==0.23.2"]
javascript = ["tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0"]
go = ["tree-sitter==0.25.2", "tree-sitter-go==0.25.0"]
java = ["tree-sitter==0.25.2", "tree-sitter-java==0.23.5"]
c = ["tree-sitter==0.25.2", "tree-sitter-c==0.24.1"]
cpp = ["tree-sitter==0.25.2", "tree-sitter-cpp==0.23.4"]
ruby = ["tree-sitter==0.25.2", "tree-sitter-ruby==0.23.1"]
php = ["tree-sitter==0.25.2", "tree-sitter-php==0.25.2"]
rust = [
  "tree-sitter==0.25.2",
  "tree-sitter-rust==0.24.2",
  "tomli==2.2.1; python_version < '3.11'",
]
# Every supported grammar, so CI and full installs follow new languages.
languages = [
  "tree-sitter==0.25.2",
  "tree-sitter-python==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-go==0.25.0",
  "tree-sitter-java==0.23.5",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-c==0.24.1",
  "tree-sitter-cpp==0.23.4",
  "tree-sitter-ruby==0.23.1",
  "tree-sitter-php==0.25.2",
  "tomli==2.2.1; python_version < '3.11'",
  # Manifest formats the components tool reads.
  "pyyaml==6.0.3",
]
# Build and deployment manifests: TOML on Python 3.10, and Compose YAML.
components = ["tomli==2.2.1; python_version < '3.11'", "pyyaml==6.0.3"]
scip = ["protobuf==7.35.1"]

[project.scripts]
deepthought = "deepthought.cli:main"
deepthought-eval = "deepthought.evaluation.__main__:main"
deepthought-graph = "deepthought.graph_cli:main"
deepthought-mcp = "deepthought.graph_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepthought"]

[tool.hatch.build.targets.wheel.force-include]
NOTICE = "deepthought/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "evals", "docs/evaluation.md", "docs/evaluation-validation.md", "docs/graph-port.md", "docs/verification.md", "pyproject.toml", "README.md", "LICENSE", "NOTICE", "licenses"]

[tool.ruff]
extend-exclude = ["src/deepthought/_scip/scip_pb2.py", "tests/fixtures"]
